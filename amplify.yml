version: 1
frontend:
  phases:
    build:
      commands:
        # Both the enquiry endpoint and the sign-in link are baked into the
        # static HTML, so without this the dev site would file real leads
        # into the production pipeline and send testers to the production
        # login. Point the dev branch at staging for both.
        - |
          if [ "$AWS_BRANCH" = "dev" ]; then
            sed -i "s|https://65qj856uhb.execute-api.us-east-1.amazonaws.com|https://z1489vlcek.execute-api.us-east-1.amazonaws.com|g" *.html
            sed -i "s|https://app.okay-legacy.com|https://dev.dhv0pcrwd3n2i.amplifyapp.com|g" *.html
            echo "dev branch: enquiries and sign-in routed to staging"
            grep -o 'https://[a-z0-9.-]*amplifyapp.com/login' index.html | sort -u
          else
            echo "$AWS_BRANCH branch: enquiries and sign-in routed to production"
          fi
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
  cache:
    paths: []
